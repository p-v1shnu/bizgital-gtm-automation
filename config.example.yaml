# Copy to config.yaml and fill in. config.yaml is git-ignored.

gtm:
  # Numeric GTM account ID (Admin > Account Settings), not the GTM-XXXXXXX ID.
  account_id: "1234567"
  # v1 provisions web containers only.
  usage_context: "web"
  # Leave empty unless the service account must impersonate a Workspace user
  # through domain-wide delegation.
  impersonate_subject: ""

paths:
  # Relative paths are resolved against this file's directory.
  service_account_key: "secrets/service-account.json"
  template: "templates/golden-container.json"

variables:
  # Names of the two Constant variables in the golden container that hold the
  # store-specific IDs. They must match the template exactly.
  ga4_measurement_id: "GA4 Measurement ID"
  meta_pixel_id: "Meta Pixel ID"

ga4:
  # Numeric Google Analytics Account ID (Admin > Account settings) that new
  # properties are created under. The service account needs Editor access on
  # this account, granted separately from GA4's own Admin > Account Access
  # Management - this is not the same permission grant as GTM's.
  account_id: "1234567"
  # IANA time zone id, not a country name - check what an existing property
  # under this account actually has set if unsure.
  timezone: "Asia/Vientiane"
  currency_code: "USD"
  # One of GA4's IndustryCategory enum values, e.g. SHOPPING, FOOD_AND_DRINK.
  industry_category: "SHOPPING"

meta:
  # Numeric Business Portfolio ID (Business Settings > Business Info) that
  # owns every pixel this script creates. Pixels are created here, not
  # under the ad account below - an ad account can only ever own one pixel
  # of its own, so creating a second store's pixel under it fails with
  # "(#6200) A pixel already exists for this account". A Business can own
  # up to 100 pixels.
  business_id: "1234567890123456"
  # Numeric Meta Ads ad account ID (Business Settings > Accounts > Ad
  # accounts), without the "act_" prefix. Each pixel created above is
  # shared to this ad account after creation, matching how every pixel
  # made by hand in Business Manager is set up (owner: the Business above;
  # this ad account listed under that pixel's "Ad accounts" sharing list).
  # May change if a client brand gets its own ad account later.
  ad_account_id: "1234567890123456"
  # Path to a text file holding nothing but a Meta System User access token
  # with the ads_management permission, and access to the ad account above
  # (Business Settings > System Users > Assigned assets). Never commit this
  # file - it is a bearer credential, like the service account key.
  access_token_path: "secrets/meta-access-token.txt"

api:
  # Retry with exponential backoff when GTM returns 429 or a 5xx.
  max_retries: 5
  initial_backoff_seconds: 1.0
  max_backoff_seconds: 60.0
  # Minimum gap between requests, to stay under the write quota.
  request_interval_seconds: 0.4

behaviour:
  warn_on_duplicate_name: true
  version_name_prefix: "Initial provisioning"
